[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "payroll_arg_reportes"
version = "0.1.14"
dependencies = [
  "numero-a-letras>=0.0.7",
  "reportlab>=4.4.10",
  "XlsxWriter>=3.2.9",
  "openpyxl>=3.1.4",
]
requires-python = ">=3.14"
authors = [
  {name="Eugenio", email="coding_with@eugeniovazquez.com.ar"},
  {name="Andres", email="andres@data99.com.ar"},
]
maintainers = [
  {name="Eugenio", email="coding_with@eugeniovazquez.com.ar"},
  {name="Andres", email="andres@data99.com.ar"},
]
description = "Reportes para Payroll en Argentina"
readme = "README.md"
license = {file = "LICENSE"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/Artimezoft/payroll_arg_reportes"
Issues = "https://github.com/Artimezoft/payroll_arg_reportes/issues"

[tool.hatch.build.targets.wheel]
packages = ["py_arg_reports"]

[project.optional-dependencies]
dev = ["pytest>=9.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
